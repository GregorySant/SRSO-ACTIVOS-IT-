<div class="modal-header"><h5 class="modal-title">{{ titulo }}</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
<div class="modal-body">
  <dl class="detalle">{% for k, v in items %}<dt>{{ k }}</dt><dd>{{ v|default:"—"|linebreaksbr }}</dd>{% endfor %}</dl>
</div>
<div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button></div>
