<form method="get" action="#{{ f.ancla }}" class="px-3 pb-3" id="{{ f.form_id }}" data-autofiltro>
  {% for n, v in f.ocultos %}<input type="hidden" name="{{ n }}" value="{{ v }}">{% endfor %}
  <div class="row g-2 align-items-end">
    <div class="col-12 col-md-4"><label class="form-label small">Buscar</label>
      <input class="form-control" name="{{ f.q_name }}" value="{{ f.q_valor }}" placeholder="Escribe para buscar..." autocomplete="off"></div>
    {% for fl in f.filtros %}
    <div class="col-6 col-md-2"><label class="form-label small">{{ fl.label }}</label>
      {% if fl.tipo == 'date' %}<input class="form-control" type="date" name="{{ fl.name }}" value="{{ fl.valor }}">
      {% else %}<select class="form-select" name="{{ fl.name }}"><option value="">Todos</option>
        {% for v, t, g in fl.opciones %}<option value="{{ v }}" {% if v == fl.valor %}selected{% endif %}>{{ t }}</option>{% endfor %}
      </select>{% endif %}
    </div>{% endfor %}
    <div class="col-auto"><a class="btn btn-outline-secondary" href="{{ f.limpiar }}#{{ f.ancla }}">Limpiar</a></div>
  </div>
</form>
